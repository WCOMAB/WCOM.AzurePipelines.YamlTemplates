stages:
  - ${{ each environment in parameters.environments }}:
    - ${{ if eq(environment.name, parameters.build) }}:
      - stage: ${{ format('Build_{0}', environment.name) }}
        displayName: ${{ format('Build {0}', environment.name) }}
        dependsOn: ${{ parameters.dependsOn }}
        jobs:
          - template: publish_jobs.yml
            parameters:
              name: ${{ environment.name }}
              sources: ${{ parameters.sources }} #Needs to be accounted for in pipeline.
              buildParameters: ${{ parameters.buildParameters }}
              # dotnet build defaults to Debug and dotnet publish to Release, so pin Release unless buildParameters set a configuration.
              ${{ if not(or(contains(lower(format(' {0} ', join(' ', parameters.buildParameters))), 'configuration='), contains(lower(format(' {0} ', join(' ', parameters.buildParameters))), ' --configuration'), contains(format(' {0} ', join(' ', parameters.buildParameters)), ' -c '), contains(format(' {0} ', join(' ', parameters.buildParameters)), ' -c:'), contains(format(' {0} ', join(' ', parameters.buildParameters)), ' -c='))) }}:
                configurationParameter: '-p:Configuration=Release'
              projectRoot: ${{ parameters.projectRoot }}
              projectSrc: "${{ parameters.projectRoot }}${{ coalesce(parameters.projectSrc, 'src') }}"
              preBuildScript: ${{ parameters.preBuildScript }}
              artifactNamePrefix: ${{ parameters.artifactNamePrefix }}
              useDotNetSDK: ${{ parameters.useDotNetSDK }}
              skipTests: ${{ coalesce(parameters.skipTests, true) }}
              testMode: ${{ parameters.testMode }}
              azureSubscription: ${{ parameters.azureSubscription }}
              dpi: ${{ parameters.dpi }}
              toolRestore: ${{ coalesce(parameters.toolRestore, false) }}
              postBuildScript: ${{ parameters.postBuildScript }}
              container: ${{ parameters.container }}
              publishEnvironmentVariables: ${{ parameters.publishEnvironmentVariables }}
              publishCodeCoverage: ${{ parameters.publishCodeCoverage }}
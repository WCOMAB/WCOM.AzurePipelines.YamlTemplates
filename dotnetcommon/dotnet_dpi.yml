steps:
- pwsh: |
    if ((Get-Command -Name dpi -ErrorAction Ignore| Measure-Object).Count -lt 1)
    {
      dotnet tool install --global DPI
    }
  displayName: Checking for DPI tool installation.
  continueOnError: true

- ${{ if eq(coalesce(parameters.dpi.report, false), true) }}:
  - ${{ if gt(length(coalesce(parameters.dpi.azureSubscription, '')), 0) }}:
    - task: AzureCLI@2
      continueOnError: true
      displayName: Creating DPI Report
      env:
        NuGetReportSettings_Endpoint: ${{ coalesce(parameters.dpi.Endpoint, '') }}
        NuGetReportSettings_RuleId: ${{ coalesce(parameters.dpi.RuleId, '') }}
        NuGetReportSettings_Stream: ${{ coalesce(parameters.dpi.Stream, 'Custom-NuGetReport') }}
      inputs:
        azureSubscription: ${{ parameters.dpi.azureSubscription }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          # ADO maps pipeline/variable-group names to uppercase env vars; Linux is case-sensitive.
          # DPI reads NuGetReportSettings_Endpoint / _RuleId / _Stream.
          if ([string]::IsNullOrWhiteSpace($env:NuGetReportSettings_Endpoint) -and -not [string]::IsNullOrWhiteSpace($env:NUGETREPORTSETTINGS_ENDPOINT)) {
            $env:NuGetReportSettings_Endpoint = $env:NUGETREPORTSETTINGS_ENDPOINT
          }
          if ([string]::IsNullOrWhiteSpace($env:NuGetReportSettings_RuleId) -and -not [string]::IsNullOrWhiteSpace($env:NUGETREPORTSETTINGS_RULEID)) {
            $env:NuGetReportSettings_RuleId = $env:NUGETREPORTSETTINGS_RULEID
          }
          if ([string]::IsNullOrWhiteSpace($env:NuGetReportSettings_Stream) -and -not [string]::IsNullOrWhiteSpace($env:NUGETREPORTSETTINGS_STREAM)) {
            $env:NuGetReportSettings_Stream = $env:NUGETREPORTSETTINGS_STREAM
          }
          if ([string]::IsNullOrWhiteSpace($env:NuGetReportSettings_Stream)) {
            $env:NuGetReportSettings_Stream = 'Custom-NuGetReport'
          }
          dpi nuget -o table report
  - ${{ else }}:
    - pwsh: dpi nuget -o table report
      continueOnError: true
      displayName: Creating DPI Report
      env:
        NuGetReportSettings_WorkspaceId: ${{ parameters.dpi.WorkspaceId }}
        NuGetReportSettings_SharedKey: ${{ parameters.dpi.SharedKey }}

- ${{ if eq(coalesce(parameters.dpi.report, false), false) }}:
  - pwsh: dpi nuget -o table analyze
    continueOnError: true
    displayName: Analyzing DPI (local output only)

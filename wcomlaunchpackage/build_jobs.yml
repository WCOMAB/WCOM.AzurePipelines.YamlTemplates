jobs:
- job: Package
  displayName: ${{ format('{0} — package release', parameters.build) }}
  pool: ${{ parameters.pool }}
  variables:
    packageFileName: ${{ parameters.packageNamePrefix }}-$(Build.BuildNumber).zip
    packageArtifactName: ${{ parameters.artifactNamePrefix }}${{ parameters.build }}
  steps:
  - pwsh: |
      New-Item -ItemType Directory -Force -Path '${{ parameters.packageStagingFolder }}' | Out-Null
    displayName: Prepare package staging folder

  - template: ../dotnetcommon/prebuild_common.yml
    parameters:
      preBuildScript: ${{ parameters.preBuildScript }}

  - ${{ if ne(parameters.entryPoint, '') }}:
    - pwsh: |
        $entry = Join-Path '${{ parameters.packageStagingFolder }}' '${{ parameters.entryPoint }}'
        if (-not (Test-Path -LiteralPath $entry)) {
          Write-Error "entryPoint not found after pre-build: $entry"
          exit 1
        }
        Write-Host "entryPoint OK: $entry"
      displayName: Verify entryPoint

  - ${{ if eq(parameters.signExecutables, true) }}:
    - template: sign_steps.yml
      parameters: ${{ parameters }}

  - task: ArchiveFiles@2
    displayName: Create release ZIP
    inputs:
      rootFolderOrFile: ${{ parameters.packageStagingFolder }}
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/$(packageFileName)
      replaceExistingArchive: true

  - template: ../dotnetcommon/postbuild_common.yml
    parameters:
      postBuildScript: ${{ parameters.postBuildScript }}

  - task: PublishPipelineArtifact@1
    displayName: Publish $(packageArtifactName) artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/$(packageFileName)
      artifactName: $(packageArtifactName)
